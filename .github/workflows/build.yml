name: Build and Release Associate Quiz

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: macos-latest
            artifact: macos

          - platform: windows-latest
            artifact: windows

          - platform: ubuntu-22.04
            artifact: linux

    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Build and release Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Associate Quiz ${{ github.ref_name }}"
          releaseBody: |
            ## Associate Quiz ${{ github.ref_name }}

            Aplicación de estudio para practicar preguntas.

            ### Descargas

            - macOS: archivo `.dmg`
            - Windows: archivos `.msi` / `.exe`
            - Linux: archivos `.deb` / `.rpm` / `.AppImage`

            Selecciona el archivo correspondiente a tu sistema operativo.

          releaseDraft: false
          prerelease: false